name: Update shelf

on:
  # Cron runs in UTC; Malaysia is UTC+8. GitHub may start a scheduled run some minutes late.
  schedule:
    # Everything, every 2 hours from 6am to 10pm: 06:17, 08:17 … 22:17.
    - cron: "17 22,0,2,4,6,8,10,12,14 * * *"
    # What's on TV now (unifi TV, RTMKlik) on the half hours between, until midnight:
    # 06:47, 07:17, 07:47 … 23:17, 23:47. No YouTube feeds, so the YouTube cookies are spared.
    - cron: "47 22,23,0-15 * * *"
    - cron: "17 23,1,3,5,7,9,11,13,15 * * *"
  # Also started from outside (cron-job.org), as GitHub's own schedule runs late or not at all
  # when it is busy. "only" picks the apps, as --only does; empty rebuilds everything.
  workflow_dispatch:
    inputs:
      only:
        description: 'Rebuild only these sources, e.g. "unifi,rtmklik" (empty: everything)'
        required: false
        default: ""
  push:
    paths: [build_shelf.py, config.json, .github/workflows/update.yml]

permissions:
  contents: write

concurrency:
  group: update-shelf
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install yt-dlp
        run: python3 -m pip install --quiet --upgrade yt-dlp
      - name: Build shelf.json
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}   # youtube.com cookies (Netscape cookies.txt); optional
          SCHEDULE: ${{ github.event.schedule }}
          ONLY: ${{ inputs.only }}
        run: |
          # The half-hourly schedules, and a dispatch asking for it, rebuild only some apps;
          # anything else rebuilds all.
          only=()
          if [ -n "$SCHEDULE" ] && [ "$SCHEDULE" != "17 22,0,2,4,6,8,10,12,14 * * *" ]; then only=(--only unifi,rtmklik); fi
          case "$ONLY" in
            "") ;;
            *[!a-z0-9_,]*) echo "ignoring unexpected only=$ONLY" ;;
            *) only=(--only "$ONLY") ;;
          esac
          if [ -n "$YT_COOKIES" ]; then
            umask 077
            printf '%s\n' "$YT_COOKIES" > "$RUNNER_TEMP/yt-cookies.txt"
            python3 build_shelf.py "${only[@]}" --youtube-cookie-file "$RUNNER_TEMP/yt-cookies.txt" || status=$?
            rm -f "$RUNNER_TEMP/yt-cookies.txt"
            exit ${status:-0}
          else
            python3 build_shelf.py "${only[@]}"
          fi
      - name: Commit if it changed
        run: |
          if git diff --quiet -- shelf.json image_cache.json && [ -z "$(git status --porcelain -- image_cache.json)" ]; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add shelf.json image_cache.json
          git commit -m "Update shelf.json"
          git pull --rebase --quiet origin main && git push
