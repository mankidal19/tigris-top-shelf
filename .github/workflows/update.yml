name: Update shelf

on:
  schedule:
    - cron: "17 * * * *"   # hourly: the unifi TV guide changes by the hour
  workflow_dispatch:
  push:
    paths: [build_shelf.py, config.json, .github/workflows/update.yml]

permissions:
  contents: write

concurrency:
  group: update-shelf
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install yt-dlp
        run: python3 -m pip install --quiet --upgrade yt-dlp
      - name: Build shelf.json
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}   # youtube.com cookies (Netscape cookies.txt); optional
        run: |
          if [ -n "$YT_COOKIES" ]; then
            umask 077
            printf '%s\n' "$YT_COOKIES" > "$RUNNER_TEMP/yt-cookies.txt"
            python3 build_shelf.py --youtube-cookie-file "$RUNNER_TEMP/yt-cookies.txt" || status=$?
            rm -f "$RUNNER_TEMP/yt-cookies.txt"
            exit ${status:-0}
          else
            python3 build_shelf.py
          fi
      - name: Commit if it changed
        run: |
          if git diff --quiet -- shelf.json; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add shelf.json
          git commit -m "Update shelf.json"
          git push
