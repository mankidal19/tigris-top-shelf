name: Viu Scene probe (temporary)

on:
  push:
    paths: [.github/workflows/viuscene-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Look at Viu Scene's markup and API from GitHub's servers
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          B=https://www.viu.com/ott/viuscene
          curl -sS -A "$UA" -o trending.html "$B/trending/malaysia/"
          curl -sS -A "$UA" -o posts.json -w "posts HTTP %{http_code}\n" "$B/wp-json/wp/v2/posts?per_page=10&_embed=wp:featuredmedia,wp:term"
          curl -sS -A "$UA" -o types.json -w "types HTTP %{http_code}\n" "$B/wp-json/wp/v2/types"
          python3 - <<'PY'
          import json, re
          page = open("trending.html", encoding="utf-8", errors="replace").read()
          print("=== trending: around each 'Watch Now'")
          for m in list(re.finditer(r"Watch Now", page))[:3]:
              print(re.sub(r"\s+", " ", page[max(0, m.start() - 2500):m.end() + 300]))
              print("-----")
          print("=== trending: all img src/srcset and a href near Watch Now")
          for m in re.finditer(r"Watch Now", page):
              chunk = page[max(0, m.start() - 2500):m.end() + 50]
              imgs = re.findall(r'<img[^>]+>', chunk)
              hrefs = re.findall(r'href="([^"]+)"', chunk)
              print(imgs[-1][:600] if imgs else None, "|", hrefs[-2:])
          print("=== trending: tabs / country filter markup")
          for m in list(re.finditer(r"Korean Dramas", page))[:2]:
              print(re.sub(r"\s+", " ", page[max(0, m.start() - 1500):m.end() + 200]))
          try:
              types = json.load(open("types.json"))
              print("=== types:", {k: v.get("rest_base") for k, v in types.items()} if isinstance(types, dict) else types)
          except Exception as e:
              print("types:", e)
          try:
              posts = json.load(open("posts.json"))
          except Exception as e:
              print("posts:", e, open("posts.json").read()[:500]); posts = []
          for p in posts[:10] if isinstance(posts, list) else []:
              emb = p.get("_embedded") or {}
              media = (emb.get("wp:featuredmedia") or [{}])[0]
              sizes = {k: (v.get("width"), v.get("height"), v.get("source_url")) for k, v in ((media.get("media_details") or {}).get("sizes") or {}).items()}
              terms = [t.get("name") for group in emb.get("wp:term") or [] for t in group]
              print("=== post", p.get("date"), p.get("link"))
              print("  title:", p.get("title", {}).get("rendered"))
              print("  excerpt:", re.sub(r"<[^>]+>", "", p.get("excerpt", {}).get("rendered", ""))[:200].strip())
              print("  terms:", terms)
              print("  media:", media.get("source_url"), (media.get("media_details") or {}).get("width"), (media.get("media_details") or {}).get("height"))
              print("  sizes:", sizes)
              print("  keys:", sorted(p.keys()))
          if isinstance(posts, list) and posts:
              print("=== first post content (start)")
              print(re.sub(r"\s+", " ", posts[0].get("content", {}).get("rendered", ""))[:2500])
          PY
