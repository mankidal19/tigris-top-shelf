name: Viu Scene probe (temporary)

on:
  push:
    paths: [.github/workflows/viuscene-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch the Viu Scene pages from GitHub's servers
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          mkdir out
          i=0
          for u in https://www.viu.com/ott/viuscene/trending/malaysia/ https://www.viu.com/ott/viuscene/latest/ https://www.viu.com/ott/my/en; do
            i=$((i+1))
            echo "=================== $i $u"
            curl -sS -L -A "$UA" -o out/$i.html -D out/$i.headers -w "HTTP %{http_code} final=%{url_effective} bytes=%{size_download}\n" "$u" || true
            grep -iE '^(HTTP|location|content-type|server|x-cache|cf-ray|x-amz)' out/$i.headers | head -20
            echo "--- markers"
            grep -o '<script[^>]*id="__NEXT_DATA__"[^>]*>' out/$i.html | head -3
            grep -oE '(wp-json[^"]{0,60}|/feed/|application/ld\+json|_next/data/[^"]*|"buildId":"[^"]*"|https?://[a-z0-9.-]*api[a-z0-9.-]*/[^"]{0,80})' out/$i.html | sort | uniq -c | sort -rn | head -25
            echo "--- title"
            grep -o '<title>[^<]*</title>' out/$i.html | head -1
          done
          python3 - <<'PY'
          import json, re
          for i in (1, 2):
              try:
                  page = open(f"out/{i}.html", encoding="utf-8", errors="replace").read()
              except OSError:
                  continue
              m = re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', page, re.S)
              print(f"=================== page {i}: __NEXT_DATA__ {'found' if m else 'missing'}")
              if not m:
                  print(re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", re.sub(r"(?s)<(script|style)[^>]*>.*?</\1>", " ", page)))[:4000])
                  for s in re.findall(r"(?s)<script[^>]*>(.*?)</script>", page)[:40]:
                      if len(s) > 500:
                          print("--- inline script", len(s), s[:600].replace("\n", " "))
                  continue
              data = json.loads(m.group(1))
              def walk(o, path="", depth=0):
                  if depth > 8: return
                  if isinstance(o, dict):
                      for k, v in o.items():
                          size = "/" + str(len(v)) if isinstance(v, (dict, list)) else ""
                          val = "" if isinstance(v, (dict, list)) else repr(v)[:140]
                          print(f"{path}.{k} [{type(v).__name__}{size}] {val}")
                          walk(v, f"{path}.{k}", depth + 1)
                  elif isinstance(o, list) and o:
                      walk(o[0], path + "[0]", depth + 1)
              walk(data.get("props", data))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viuscene-pages
          path: out/
