name: Viu Scene probe (temporary)

on:
  push:
    paths: [.github/workflows/viuscene-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trending pictures and matching articles
        run: |
          python3 - <<'PY'
          import json, re, struct, urllib.request, urllib.parse, html
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130.0 Safari/537.36"}
          B = "https://www.viu.com/ott/viuscene"
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=30) as r:
                  return r.read(), r.headers.get("content-type")
          def size(data):
              if data[:8] == b"\x89PNG\r\n\x1a\n": return struct.unpack(">II", data[16:24])
              if data[:4] == b"RIFF": return ("webp", len(data))
              i = 2
              while i < len(data):
                  if data[i] != 0xFF: i += 1; continue
                  m = data[i + 1]
                  if m in (0xC0, 0xC1, 0xC2):
                      h, w = struct.unpack(">HH", data[i + 5:i + 9]); return (w, h)
                  i += 2 + struct.unpack(">H", data[i + 2:i + 4])[0]
          page = get(B + "/trending/malaysia/")[0].decode()
          items = re.findall(r'<div class="top-10-item">.*?href="([^"]+)".*?<img src="([^"]+)" alt="([^"]*)"', page, re.S)
          print("items:", len(items))
          cats = json.loads(get(B + "/wp-json/wp/v2/categories?per_page=100")[0])
          print("categories:", [(c["id"], c["name"], c["count"]) for c in cats])
          for href, img, name in items:
              vod = re.search(r"/vod/(\d+)/", href).group(1)
              base = img.split("?")[0]
              for q in ("", "?im=Resize,width=1280"):
                  try:
                      d, t = get(base + q); print(f"  {name!r} {q or 'original'}: {t} {size(d)} {len(d)}B")
                  except Exception as e:
                      print(f"  {name!r} {q}: {e}")
              short = re.split(r"[(\[]", html.unescape(name))[0].strip()
              posts = json.loads(get(B + "/wp-json/wp/v2/posts?per_page=5&_fields=id,link,title,content,featured_media&search=" + urllib.parse.quote(short))[0])
              for p in posts:
                  c = p["content"]["rendered"]
                  print(f"    post {p['title']['rendered'][:90]!r} links vod {vod}: {('/' + vod + '/') in c or ('vod/' + vod) in c} | my links: {len(re.findall(r'/ott/my/', c))} media {p['featured_media']}")
          print("=== latest posts: which link to Malaysian vod pages")
          for p in json.loads(get(B + "/wp-json/wp/v2/posts?per_page=20&_fields=date,title,content,categories")[0]):
              c = p["content"]["rendered"]
              print(p["date"][:10], p["categories"], len(re.findall(r"/ott/my/", c)), sorted(set(re.findall(r"/ott/([a-z]{2})/", c))), p["title"]["rendered"][:80])
          PY
